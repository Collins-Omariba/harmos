services:
  harmos:
    build:
      context: .
      dockerfile: Dockerfile
    image: harmos:local
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/harmos.db"
      AI_BASE_URL: "https://api.meta.ai/v1"
      AI_API_KEY: "${AI_API_KEY:-your_key_here}"
      AI_MODEL: "muse-spark-1.3"
      HARMOS_CACHE_DIR: "/data/.cache"
      HARMOS_DEMO_MODE: "${HARMOS_DEMO_MODE:-0}"
      HARMOS_UPLOAD_DIR: "/data/uploads"
      HARMOS_CATALOG_ADAPTER: "${HARMOS_CATALOG_ADAPTER:-local}"
      HARMOS_AUTH_ENABLED: "${HARMOS_AUTH_ENABLED:-0}"
      HARMOS_WORKSPACE_PASSWORD: "${HARMOS_WORKSPACE_PASSWORD:-}"
      LCSC_API_KEY: "${LCSC_API_KEY:-}"
      LCSC_API_SECRET: "${LCSC_API_SECRET:-}"
      LCSC_API_BASE_URL: "${LCSC_API_BASE_URL:-https://api.lcsc.com}"
    volumes:
      # /data holds harmos.db; /data/.cache holds the AI disk cache.
      - harmos-data:/data
      - harmos-cache:/data/.cache
    restart: unless-stopped

volumes:
  harmos-data:
  harmos-cache:
